name: Release

# A tag vX.Y.Z publishes that version to npm, with provenance (the package page links back to this build).
# Needs the repository secret NPM_TOKEN (an npm automation or granular token allowed to publish "astralmanach").

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: npm run smoke
      - name: Already on npm?
        id: published
        run: |
          if npm view "astralmanach@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "This version is already on npm (published by hand): nothing to do."
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
