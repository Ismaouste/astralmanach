name: Bug report
description: Something gives a wrong sky, throws, or does not match the docs
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows it — the date, hour, place and the call.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: astralmanach version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22, Windows 11"
